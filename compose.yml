services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horsesharing
      POSTGRES_USER: horsesharing
      POSTGRES_PASSWORD: horsesharing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horsesharing -d horsesharing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
